[package]
name = "habit-tracker"
version = "0.1.0"
edition = "2021"
description = "Daily Habit Tracker CLI - Track daily habits and maintain consistency"

[[bin]]
name = "habit-tracker"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
